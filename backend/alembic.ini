# Alembic configuration for Movie Companion.
# The database URL and logging come from the app (movie_companion.core.config / .logging),
# so neither is configured here. Run from backend/: `uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
