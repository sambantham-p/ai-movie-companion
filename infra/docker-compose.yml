# Local development infrastructure: PostgreSQL and Redis.
# Ports bind to 127.0.0.1 only, so nothing is exposed to your network.
# Usage (from the repo root): `make infra-up` / `make infra-down`.
name: movie-companion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie}
      POSTGRES_DB: ${POSTGRES_DB:-movie_companion}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie} -d ${POSTGRES_DB:-movie_companion}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
